name: Send PassBar Push Notifications

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend cron endpoint
        run: |
          curl --fail-with-body -sS -X POST "${API_URL}/internal/cron/notifications" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
